    <script type="text/javascript">
    (function() {
    // Load partials dynamically
    $.when(
      $('#selected-pubs').load('partials/selected_pubs.html'),
      $('#contributions').load('partials/contributions.html'),
      $('#co-authors').load('partials/co_authors.html')
    ).done(function() {

    });


      // Tab click -> smooth scroll to section
      $('.section-tabs .tab-btn').on('click', function() {
        var target = $(this).data('target');
        var $section = $('#' + target);
        if ($section.length) {
          var offset = $section.offset().top - 70;
          $('html, body').animate({scrollTop: offset}, 400);
        }
      });

      // Scroll -> highlight active tab
      var sections = ['selected-pubs', 'contributions', 'co-authors'];
      var $tabs = $('.section-tabs .tab-btn');
      var isScrolling = false;

      function updateActiveTab() {
        var scrollPos = $(window).scrollTop() + 120;
        var activeId = sections[0];
        for (var i = 0; i < sections.length; i++) {
          var $sec = $('#' + sections[i]);
          if ($sec.length && $sec.offset().top <= scrollPos) {
            activeId = sections[i];
          }
        }
        $tabs.removeClass('active');
        $tabs.filter('[data-target="' + activeId + '"]').addClass('active');
      }

      $(window).on('scroll', function() {
        if (!isScrolling) {
          window.requestAnimationFrame(function() {
            updateActiveTab();
            isScrolling = false;
          });
          isScrolling = true;
        }
      });

      updateActiveTab();
    })();
    </script>
